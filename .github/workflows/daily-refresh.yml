name: Refresh Profile README

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  push:
    branches:
      - main
      - master
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Refresh README
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate SVG graphics
        run: node scripts/generate-graphics.js

      - name: Compile README from profile data
        run: node scripts/generate.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/*.svg data/profile.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "build: auto-refresh profile README [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi
